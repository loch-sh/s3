name: Release

on:
  push:
    tags: ["[0-9]*", "v*"]

# Least privilege by default; jobs that publish raise their own permissions
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: s3-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: s3-linux-arm64.tar.gz
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            archive: s3-windows-amd64.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (Linux targets)
        if: matrix.runner == 'ubuntu-latest' && !contains(matrix.target, 'windows')
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cross@0.2.5

      - name: Build (cross)
        if: matrix.runner == 'ubuntu-latest' && !contains(matrix.target, 'windows')
        run: cross build --release --target ${{ matrix.target }}

      # The cross 0.2.5 Windows image exits without output with the current
      # stable toolchain: build natively with the MinGW-w64 cross compiler.
      - name: Install MinGW-w64 (Windows target)
        if: contains(matrix.target, 'windows')
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build (MinGW-w64)
        if: contains(matrix.target, 'windows')
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive (Linux)
        if: "!contains(matrix.target, 'windows')"
        run: tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release s3 loch-s3

      - name: Archive (Windows)
        if: contains(matrix.target, 'windows')
        run: zip ${{ matrix.archive }} target/${{ matrix.target }}/release/s3.exe target/${{ matrix.target }}/release/loch-s3.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # Both macOS targets in a single job: macOS runners are scarce, and the
  # Apple Silicon runner builds x86_64 with the same SDK.
  build-macos:
    name: Build macOS (arm64 + amd64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Archive
        run: |
          tar czf s3-macos-arm64.tar.gz -C target/aarch64-apple-darwin/release s3 loch-s3
          tar czf s3-macos-amd64.tar.gz -C target/x86_64-apple-darwin/release s3 loch-s3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3-macos
          path: s3-macos-*.tar.gz

  # Published as soon as the Linux and Windows binaries are ready, even when
  # the macOS job failed (usually no runner assigned). "Re-run failed jobs"
  # then re-runs build-macos and this job, which adds the macOS archives to
  # the existing release.
  release:
    name: Create Release
    needs: [build, build-macos]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.cliff.outputs.content }}
          overwrite_files: true
          files: |
            *.tar.gz
            *.zip

      - name: Report missing macOS binaries
        if: needs.build-macos.result != 'success'
        run: |
          echo "::warning::macOS binaries are missing (build-macos: ${{ needs.build-macos.result }}). Re-run the failed jobs of this run to add them to the release."
          echo "### macOS binaries missing" >> "$GITHUB_STEP_SUMMARY"
          echo "build-macos ended with \`${{ needs.build-macos.result }}\`. Use **Re-run failed jobs** to add them to the release." >> "$GITHUB_STEP_SUMMARY"
