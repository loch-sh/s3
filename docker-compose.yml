services:
  caddy:
    image: caddy:2.11-alpine
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  s3:
    build: .
    image: loch/s3
    # Reached through Caddy only; published on loopback for local debugging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - S3_PORT=8080
      - S3_DATA_DIR=/data
      - S3_ACCESS_KEY_ID=myaccesskey
      - S3_SECRET_ACCESS_KEY=mysecretkey
      # SSE-S3 master key read from a file, kept out of the environment.
      # Create it first (owned by the container user, uid 100):
      #   openssl rand -base64 32 > master.key && sudo chown 100:101 master.key && chmod 0400 master.key
      - S3_ENCRYPTION_KEY_FILE=/run/secrets/master_key
    secrets:
      - master_key
    volumes:
      - s3-data:/data

secrets:
  master_key:
    file: ./master.key

volumes:
  s3-data:
  caddy-data:
