[package]
name = "s3"
version = "1.4.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "macros", "signal", "process"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful"] }
http-body-util = "0.1"
md5 = "0.8"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
hmac = "0.13"
sha2 = "0.11"
serde_json = "1"
chrono = "0.4"
subtle = "2"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
aes-gcm = "0.11"
hkdf = "0.13"
base64 = "0.23"
rand = "0.10"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }

[[bin]]
name = "s3"
path = "src/main.rs"

[[bin]]
name = "loch-s3"
path = "src/bin/loch-s3.rs"
